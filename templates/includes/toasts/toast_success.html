<div class="toast custom-toast rounded-0 border-top 0" data-bs-autohide="false">
    <div class="arrow-up arrow-success"></div>
    <div class="w-100 toast-capper bg-success"></div>
    <div class="toast-header bg-white text-dark">
        <strong class="mr-auto">Success!</strong>
        <button type="button" class="ml-2 mb-1 close text-dark text-end" data-bs-dismiss="toast" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="toast-body bg-white">
        <div class="row">
            <div class="col">
                {{ message }}
                <hr class="mt-1 mb-3">
            </div>
        </div>
        {% if grand_total %}
            <p class="bg-white py-1">Your Basket: {{ product_count }}</p>
            <div class="basket-notification-wrapper">
                {% for item in basket_items %}
                    <div class="row">
                        <div class="col-2 my-1">
                            <img src="{{ item.product.main_image.url }}" alt="{{ item.product.name }}" width="40">
                        </div>
                        <div class="col-10">
                            <p class="my-0"><strong>{{ item.product.name }}</strong></p>
                            <p class="my-0 small text-muted">Qty: {{ item.quantity }}</p>
                        </div>
                    </div>
                {% endfor %}
            </div>
            <div class="row my-2">
                <div class="col">
                    <p class="mt-3 mb-1"><strong>
                        TOTAL (exc. delivery):
                        <span class="float-right bold">£{{ total|floatformat:2 }}</span> 
                    </strong></p>
                    <a href="{% url 'basket' %}" class="btn btn-white rounded-0" id="view-basket-btn">View Basket</a>
                    <a href="{% url 'checkout' %}" class="btn btn-black rounded-0">Secure Checkout</a>
                </div>
            </div>
        {% endif %}
    </div>
</div>
