{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block inner_content %}
    <h2 class="my-4">{% trans "Change Password" %}</h2>

    <form method="POST" action="{% url 'account_change_password' %}" class="password_change">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" name="action" class="btn-black">{% trans "Change Password" %}</button>
        <a href="{% url 'account_reset_password' %}" class="general-link">{% trans "Forgot Password?" %}</a>
    </form>
{% endblock %}
