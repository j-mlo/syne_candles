{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container-fluid">
    <div class="row">
        <div class="col-12 col-md-6 col-lg-4 offset-lg-2">
            <div class="my-5" id="product-image-container">
                {% if product.image %}
                    <a href="{{ product.image.url }}" target="_blank">
                        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="card-img-top rounded-0">
                    </a>
                {% else %}
                    <a href="">
                        <img src="{{ MEDIA_URL }}product-placeholder.jpg" alt="{{ product.name }}" class="card-img-top rounded-0">
                    </a>
                {% endif %}
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="mb-5 mt-md-5" id="product-detail-container">
                <h4 class="mb-0">{{ product.name }}</h4>

                {% if product.rating %}
                    <small><i class="fa-solid fa-star"> {{ product.rating }}</i></small>
                {% endif %}

                <p class="text-left">£{{ product.price }}</p>

                <p class="mt-3">{{ product.description }}</p>

                <form method="POST" action="">
                    <button type="submit" class="btn btn-lg btn-black">Add to bag</button>
                </form>
            </div>
            <div>
                <h5>Customer Reviews</h5>
            </div>
        </div>
    </div>
</div>

{% endblock %}
